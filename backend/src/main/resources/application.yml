application:
  name: Bug Tracker System

server:
  port: 8082
  servlet:
    context-path: /api/v1/bug-tracker
  tomcat:
    relaxed-path-chars:
      - '['
      - '\'
      - ']'
      - '^'
      - '`'
      - '{'
      - '|'
      - '}'
    relaxed-query-chars:
      - '['
      - '\'
      - ']'
      - '^'
      - '`'
      - '{'
      - '|'
      - '}'

spring:
  profiles:
    active: prod
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/bugtracker
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    schemas: public
    locations: classpath:db/migrations
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_CREDS_USR}
    password: ${MAIL_CREDS_PSW}
    properties:
      mail:
        smtp:
          auth: auth
          starttls:
            enable: true

jwt:
  private-key-path: classpath:jwt/private_key.pem
  public-key-path: classpath:jwt/public_key.pem
  expiration: 3600000
