application:
  frontend:
    url: http://localhost:4200
  backend:
    baseUrl: http://localhost:8082

logging:
  level:
    org:
      springframework:
        security: DEBUG

spring:
  jpa:
    hibernate:
      ddl-auto: none

jwt:
  private-key-path: classpath:jwt/private_key.pem
  public-key-path: classpath:jwt/public_key.pem
  expiration: 3600000
