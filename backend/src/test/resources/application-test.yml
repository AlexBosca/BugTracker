spring:
  config:
    activate:
      on-profile: test

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

  datasource:
    url: none
    driver-class-name: org.springframework.boot.jdbc.NoDriverClass

  jpa:
    hibernate:
      ddl-auto: none

  data:
    jpa:
      repositories:
        enabled: true

  sql:
    init:
      mode: never

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_CREDS_USR}
    password: ${MAIL_CREDS_PSW}
    properties:
      mail:
        smtp:
          auth: auth
          starttls:
            enable: true

management:
  metrics:
    enable:
      process:
        files: false
      jvm:
        threads: true
        memory: true
