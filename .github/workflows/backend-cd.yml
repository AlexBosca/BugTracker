name: Backend CD Pipeline

on:
  workflow_run:
    workflows:
      - Backend CI Pipeline
    types:
      - completed

jobs:
  deploy:
    name: Deploy Backend

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'
    
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"
