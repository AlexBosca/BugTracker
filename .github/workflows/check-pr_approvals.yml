name: Pull Request Approval Check

on:
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

jobs:
  check-approvals:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read
      contents: read

    steps:
      - name: Check if all reviewers approved
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            // Get requested reviewers
            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number
            });

            const requestedReviewers =
              pr.data.requested_reviewers.map(r => r.login);

            console.log("Requested reviewers:", requestedReviewers);

            // Get all reviews
            const reviewsResponse = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number
            });

            const reviews = reviewsResponse.data;

            // Keep latest review state for each reviewer
            const latestReviewState = {};

            for (const review of reviews) {
              latestReviewState[review.user.login] = review.state;
            }

            console.log("Latest review states:", latestReviewState);

            // Check if every requested reviewer approved
            const notApproved = requestedReviewers.filter(
              reviewer => latestReviewState[reviewer] !== "APPROVED"
            );

            if (notApproved.length > 0) {
              core.setFailed(
                `Missing approvals from: ${notApproved.join(", ")}`
              );
            } else {
              console.log("All reviewers approved the pull request.");
            }
